<main id="top"><section class="panel" id="talk-to-customers"><div class="slide-art"><img src="/assets/work/02-talk-to-customers.jpeg" width="864" height="1536" fetchpriority="high" loading="eager" decoding="async" alt="02. Talk to customers. Weekly conversations to understand skin goals, struggles, expectations and experiences with The Grey."><button class="menu-hit" aria-label="Open menu"></button></div></section><footer class="contact-band"><a href="/work/"><span>OUR WORK.</span><small>BACK</small></a></footer></main><aside class="overlay" aria-hidden="true" aria-label="Site menu"><div class="overlay-top"><span>cre-ation</span><button class="close" aria-label="Close menu">[ CLOSE ]</button></div><nav class="nav"><a href="/">Home</a><a href="/work/">Our work</a><a href="/#what-we-do">What we do</a><a href="/#metrics">Metrics</a><a href="/contact/">Contact</a></nav></aside><script>
    const overlay=document.querySelector('.overlay');
    const toggle=(open)=>{overlay.classList.toggle('open',open);overlay.setAttribute('aria-hidden',String(!open));document.body.style.overflow=open?'hidden':'';(open?document.querySelector('.close'):document.querySelector('.menu-hit'))?.focus()};
    document.querySelectorAll('.menu-hit').forEach(button=>button.addEventListener('click',()=>toggle(true)));
    document.querySelector('.close').addEventListener('click',()=>toggle(false));
    document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>toggle(false)));
    document.addEventListener('keydown',event=>{if(event.key==='Escape')toggle(false)});
</script></body></html>
