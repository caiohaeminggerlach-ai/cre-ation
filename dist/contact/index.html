<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Contact — cre-ation</title>
  <meta name="description" content="Start a conversation with cre-ation about making your business better.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='11' cy='12' r='6' fill='%23fff'/%3E%3Ccircle cx='21.5' cy='10' r='4.5' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
    main{width:100%;max-width:960px;min-height:100svh;margin:auto;padding:clamp(24px,5.3vw,52px);display:flex;flex-direction:column}
    a{color:inherit}
    a:focus-visible{outline:3px solid #fff;outline-offset:5px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{font-size:clamp(25px,3.8vw,38px);font-weight:900;letter-spacing:-.075em;text-decoration:none}
    .home{font-size:clamp(14px,2.2vw,20px);white-space:nowrap;text-decoration:none}
    .home:hover{text-decoration:underline}
    .content{margin:auto 0;padding:clamp(42px,9vh,95px) 0}
    .eyebrow{font-size:clamp(13px,1.9vw,18px);letter-spacing:.13em;margin:0 0 clamp(20px,4vw,36px)}
    h1{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(55px,11.8vw,115px);font-weight:900;line-height:.9;letter-spacing:-.045em;margin:0 0 clamp(24px,5vw,48px)}
    .message{font-size:clamp(17px,2.7vw,25px);line-height:1.4;max-width:32ch;margin:0}
    .email{display:inline-block;max-width:100%;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(30px,6.5vw,62px);font-weight:900;line-height:1;letter-spacing:-.035em;overflow-wrap:anywhere;text-decoration:none;border-bottom:2px solid currentColor;padding-bottom:11px;margin-top:clamp(32px,7vw,68px)}
    .email:hover{opacity:.7}
    footer{border-top:1px solid #bcbcbc;padding-top:15px;display:flex;align-items:start;justify-content:space-between;gap:20px;font-size:clamp(12px,1.8vw,17px);line-height:1.35}
    footer span:last-child{text-align:right}
    @media(min-width:700px){main{padding:clamp(28px,4vw,44px)}.content{padding:3vh 0}h1{font-size:clamp(70px,9.4vw,100px);margin-bottom:35px}.email{margin-top:30px}}
    @media(max-height:650px){.content{padding:25px 0}h1{font-size:clamp(49px,10.5vw,84px);margin-bottom:20px}.email{margin-top:25px}}
    @media(min-width:961px){body{padding:24px 0}}
    @keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .content .eyebrow,.content h1,.content .message,.content .email{animation:arrive .75s cubic-bezier(.2,.7,.2,1) backwards}
    .content h1{animation-delay:.1s}.content .message{animation-delay:.2s}.content .email{animation-delay:.3s}
    .email{transition:opacity .25s ease,transform .25s ease}
    .email:hover,.email:focus-visible{transform:translateY(-3px)}
    @media(prefers-reduced-motion:reduce){.content .eyebrow,.content h1,.content .message,.content .email{animation:none}.email{transition:none}}
  </style>
</head>
<body>
  <main>
    <header><a class="brand" href="/">cre-ation</a><a class="home mono" href="/">[ HOME ]</a></header>
    <section class="content" aria-labelledby="contact-heading">
      <p class="eyebrow mono">CONTACT / CRE-ATION</p>
      <h1 id="contact-heading">LET'S MAKE<br>SOMETHING<br>BETTER.</h1>
      <p class="message mono">Tell us what you're building and what you want to improve.</p>
      <a class="email" href="mailto:hello@cre-ation.io?subject=Let's%20make%20something%20better" aria-label="Email hello at cre-ation dot io">HELLO@CRE-ATION.IO</a>
    </section>
    <footer class="mono"><span>IDEAS PEOPLE LOVE.<br>BUSINESSES GROW.</span><span>PRODUCT · EXPERIENCE<br>COMMUNICATION</span></footer>
  </main>
</body>
</html>
