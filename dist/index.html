<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>cre-ation — We create what people love</title>
  <meta name="description" content="Cre-ation is a creative company improving products, customer experiences and communication.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='11' cy='12' r='6' fill='%23fff'/%3E%3Ccircle cx='21.5' cy='10' r='4.5' fill='%23fff'/%3E%3Ccircle cx='20' cy='22' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/01-hero.png" fetchpriority="high">
  <link rel="preload" as="image" href="assets/02-system.jpeg">
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:#050505}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}main{width:100%;max-width:960px;margin:0 auto;background:#fff;overflow:hidden}.panel{position:relative;line-height:0}.panel img{display:block;width:100%;height:auto}.menu-hit{position:absolute;z-index:2;right:4%;top:1%;width:28%;height:6%;border:0;background:transparent;cursor:pointer}.work-hit{position:absolute;z-index:2;left:22%;top:78%;width:56%;height:8%;border:0;background:transparent;cursor:pointer}.menu-hit:focus-visible,.work-hit:focus-visible{outline:3px solid #777;outline-offset:-4px}.process-strip{position:absolute;z-index:3;left:0;right:0;top:88.85%;height:5.25%;display:flex;align-items:center;justify-content:space-around;padding:0 4.3%;background:#f8f8f6;border-top:1px solid #111;border-bottom:1px solid #111;color:#111;font-size:clamp(11px,2.15vw,21px);font-weight:400;line-height:1;letter-spacing:-.02em;text-transform:uppercase}.process-stage{animation:stagePulse 6.4s ease-in-out var(--delay) infinite;opacity:.38;transform:translateY(2px)}.process-arrow{font-size:1.45em;font-weight:300;animation:arrowPulse 6.4s ease-in-out var(--delay) infinite;opacity:.28}@keyframes stagePulse{0%,18%,100%{opacity:.38;transform:translateY(2px)}5%,13%{opacity:1;transform:translateY(0)}}@keyframes arrowPulse{0%,18%,100%{opacity:.28;transform:translateX(-2px)}5%,13%{opacity:1;transform:translateX(2px)}}.overlay{position:fixed;z-index:20;inset:0;background:#050505;color:#fff;padding:max(28px,env(safe-area-inset-top)) 6vw max(28px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;opacity:0;pointer-events:none;transition:opacity .22s ease}.overlay.open{opacity:1;pointer-events:auto}.overlay-top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(20px,5vw,38px);font-weight:700}.close{font:400 clamp(16px,4vw,26px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;background:transparent;border:0;padding:12px;cursor:pointer}.nav{display:flex;flex-direction:column;justify-content:center;gap:1.2vh}.nav a{color:#fff;text-decoration:none;text-transform:uppercase;font-weight:900;font-stretch:condensed;font-size:clamp(38px,11vw,94px);line-height:.84;letter-spacing:-.045em}.nav a:hover,.nav a:focus-visible{color:#aaa;outline:none}@media(min-width:961px){body{padding:24px 0}.panel{box-shadow:0 0 0 1px rgba(255,255,255,.08)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.overlay{transition:none}.process-stage,.process-arrow{animation:none;opacity:1;transform:none}}
    .theme-invert img{filter:invert(1)}
    #what-we-do{height:0;padding-bottom:154.1%;overflow:hidden}
    #what-we-do>img{position:absolute;inset:0;width:100%;height:auto}
    .slide-footer{position:absolute;right:5.4%;bottom:3%;color:#111;font:400 clamp(10px,1.7vw,16px)/1.22 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;letter-spacing:.01em}
    #conclusion{height:0;padding-bottom:127%;overflow:hidden}
    #conclusion>img{position:absolute;inset:0;width:100%;height:auto}
    .contact-band{background:#050505;color:#fff;padding:clamp(32px,8vw,75px) 5.4%;font-family:Arial,sans-serif;line-height:1}
    .contact-band a{display:flex;justify-content:space-between;align-items:end;gap:16px;color:inherit;text-decoration:none;border-top:1px solid #fff;padding-top:clamp(20px,5vw,48px);font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(40px,10vw,96px);font-weight:900;letter-spacing:-.035em}
    .contact-band small{font:400 clamp(13px,2.2vw,21px)/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;white-space:nowrap}
    .contact-band a:hover small,.contact-band a:focus-visible small{text-decoration:underline}
    /* Motion preserves the artwork and the height of every slide. */
    #home,#system,#what-we-do,#model{background:#fff}
    #not-marketing,#metrics,#conclusion{background:#050505}
    .motion-ready .panel:not(#home)>img{transition:opacity .75s ease,transform .85s cubic-bezier(.2,.7,.2,1);opacity:1;transform:translateY(0) scale(1)}
    .motion-ready .panel:not(#home):not(.is-visible)>img{opacity:0;transform:translateY(18px) scale(1.015)}
    .motion-ready .slide-footer{transition:opacity .6s ease .3s,transform .6s ease .3s;opacity:1;transform:translateY(0)}
    .motion-ready .panel:not(.is-visible)>.slide-footer{opacity:0;transform:translateY(10px)}
    #home .process-strip{animation:stripEnter .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes stripEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .overlay .nav a{opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .4s cubic-bezier(.2,.7,.2,1),color .2s ease}
    .overlay.open .nav a{opacity:1;transform:translateY(0);transition-delay:calc(var(--item) * 45ms)}
    .overlay.open .nav a:hover,.overlay.open .nav a:focus-visible{transform:translateX(8px)}
    .contact-band a span,.contact-band a small{transition:transform .3s ease}
    .contact-band a:hover span,.contact-band a:focus-visible span{transform:translateX(5px)}
    .contact-band a:hover small,.contact-band a:focus-visible small{transform:translateX(-5px)}
    @media(prefers-reduced-motion:reduce){.motion-ready .panel:not(#home)>img,.motion-ready .slide-footer{opacity:1!important;transform:none!important;transition:none!important}#home .process-strip{animation:none}.overlay .nav a{opacity:1;transform:none;transition:none}.contact-band a span,.contact-band a small{transition:none}}
    /* Seamless story system */
    html,body{height:100%;overflow:hidden}
    body{padding:0}
    main{height:100svh;max-width:960px;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y proximity;overscroll-behavior-y:contain;scrollbar-width:none}
    main::-webkit-scrollbar{display:none}
    .panel,#what-we-do,#conclusion{height:100svh;min-height:100svh;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;scroll-snap-align:start;scroll-snap-stop:normal}
    .panel>img,#what-we-do>img,#conclusion>img{position:relative;inset:auto;width:100%;height:auto;object-fit:contain;object-position:center;clip-path:inset(5.8% 0 0 0)}
    #home>img{clip-path:inset(5.8% 0 11.2% 0)}
    .menu-hit{display:none}
    .site-header{--header-bg:#fff;--header-fg:#050505;position:fixed;z-index:15;top:0;left:50%;transform:translateX(-50%);width:min(100%,960px);height:clamp(54px,7svh,70px);padding:max(14px,env(safe-area-inset-top)) 5.4% 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(var(--header-bg) 0 82%,transparent);color:var(--header-fg);transition:background .35s ease,color .35s ease}
    .site-header.is-dark{--header-bg:#050505;--header-fg:#fff}
    .site-brand{color:inherit;text-decoration:none;font-size:clamp(15px,2.15vw,21px);font-weight:800;letter-spacing:-.045em;line-height:1}
    .site-menu{border:0;background:transparent;color:inherit;padding:10px 0 10px 20px;font:400 clamp(12px,1.6vw,16px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;cursor:pointer}
    .site-menu:focus-visible,.site-brand:focus-visible,.story-progress a:focus-visible,.final-cta:focus-visible{outline:2px solid currentColor;outline-offset:4px}
    .story-progress{--progress-color:#050505;position:fixed;z-index:14;right:max(12px,calc((100vw - min(100vw,960px))/2 + 14px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;transition:color .35s ease;color:var(--progress-color)}
    .story-progress.is-dark{--progress-color:#fff}
    .story-progress a{width:8px;height:8px;border:1px solid currentColor;border-radius:50%;color:inherit;background:transparent;opacity:.42;transition:opacity .3s ease,background .3s ease,transform .3s ease}
    .story-progress a[aria-current="true"]{opacity:1;background:currentColor;transform:scale(1.25)}
    .process-strip{top:auto;bottom:0;height:clamp(46px,6svh,62px)}
    .final-cta{position:absolute;z-index:4;right:5.4%;bottom:max(24px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:.7em;color:#fff;text-decoration:none;border-bottom:1px solid currentColor;padding:0 0 7px;font:700 clamp(20px,4vw,38px)/1 Arial,sans-serif;letter-spacing:-.035em}
    .final-cta span{transition:transform .3s ease}
    .final-cta:hover span,.final-cta:focus-visible span{transform:translateX(5px)}
    .contact-band{display:none}
    .motion-ready .panel:not(#home)>img{transition:opacity .7s ease,transform .85s cubic-bezier(.2,.7,.2,1),filter .35s ease}
    .motion-ready .panel:not(#home):not(.is-visible)>img{opacity:.15;transform:translateY(12px) scale(1.008)}
    @media(min-width:961px){body{padding:0}.panel{box-shadow:none}}
    @media(max-width:600px){.story-progress{right:8px}.story-progress a{width:6px;height:6px}.site-header{padding-left:5.4%;padding-right:5.4%}}
    @media(prefers-reduced-motion:reduce){main{scroll-snap-type:none}.site-header,.story-progress{transition:none}.final-cta span{transition:none}}
  </style>
</head>
<body>
  <header class="site-header" aria-label="Primary">
    <a class="site-brand" href="#home">cre-ation</a>
    <button class="site-menu" type="button" aria-label="Open menu">[ MENU ]</button>
  </header>
  <nav class="story-progress" aria-label="Slide progress">
    <a href="#home" aria-label="Slide 1" aria-current="true"></a>
    <a href="#system" aria-label="Slide 2"></a>
    <a href="#not-marketing" aria-label="Slide 3"></a>
    <a href="#what-we-do" aria-label="Slide 4"></a>
    <a href="#metrics" aria-label="Slide 5"></a>
    <a href="#model" aria-label="Slide 6"></a>
    <a href="#conclusion" aria-label="Slide 7"></a>
  </nav>
  <main id="top">
    <section class="panel" id="home" data-tone="light"><img src="assets/01-hero.png" alt="Cre-ation. We create what people love." width="942" height="1672" fetchpriority="high"><a class="work-hit" href="#what-we-do" aria-label="Discover our work"></a><div class="process-strip" aria-label="Creativity leads to action, measurement and iteration"><span class="process-stage" style="--delay:0s">Creativity</span><span class="process-arrow" style="--delay:.8s" aria-hidden="true">→</span><span class="process-stage" style="--delay:1.6s">Action</span><span class="process-arrow" style="--delay:2.4s" aria-hidden="true">→</span><span class="process-stage" style="--delay:3.2s">Measurement</span><span class="process-arrow" style="--delay:4s" aria-hidden="true">→</span><span class="process-stage" style="--delay:4.8s">Iteration</span></div></section>
    <section class="panel" id="system" data-tone="light"><img src="assets/02-system.jpeg" alt="We turn imagination into reality, reality into data, and data into better ideas." loading="eager"></section>
    <section class="panel" id="not-marketing" data-tone="dark"><img src="assets/03-not-marketing.jpeg" alt="We are not a marketing agency. We create businesses, products and experiences people genuinely love." loading="lazy"></section>
    <section class="panel" id="what-we-do" data-tone="light"><img src="assets/06-what-we-do-clean.png" alt="A creative agency that makes businesses better through product, customer experience and communication." width="941" height="1672" loading="lazy"><div class="slide-footer" aria-label="Ideas people love. Businesses grow.">IDEAS<br>PEOPLE LOVE<br>BUSINESSES GROW<br>—</div></section>
    <section class="panel theme-invert" id="metrics" data-tone="dark"><img src="assets/10-metrics.jpeg" alt="Three metrics, one goal: acquisition, retention and referral." loading="lazy"></section>
    <section class="panel" id="model" data-tone="light"><img src="assets/04-model.jpeg" alt="No retainer. Our incentives are aligned with yours." loading="lazy"></section>
    <section class="panel theme-invert" id="conclusion" data-tone="dark"><img src="assets/12-conclusion-clean.png" alt="The beautiful underlying system: creativity, action, measurement and iteration." width="1024" height="1536" loading="lazy"><a class="final-cta" href="/contact/"><span>LET'S TALK</span><b aria-hidden="true">→</b></a></section>
  </main>
  <aside class="overlay" aria-hidden="true" aria-label="Site menu">
    <div class="overlay-top"><span>cre-ation</span><button class="close" aria-label="Close menu">[ CLOSE ]</button></div>
    <nav class="nav"><a style="--item:0" href="#home">Home</a><a style="--item:1" href="#what-we-do">What we do</a><a style="--item:2" href="#metrics">Metrics</a><a style="--item:3" href="#conclusion">Conclusion</a><a style="--item:4" href="/contact/">Contact</a></nav>
  </aside>
  <script>
    const overlay=document.querySelector('.overlay');
    const main=document.querySelector('main');
    const header=document.querySelector('.site-header');
    const progress=document.querySelector('.story-progress');
    const headerMenu=document.querySelector('.site-menu');
    const panels=[...document.querySelectorAll('.panel')];
    const progressLinks=[...document.querySelectorAll('.story-progress a')];
    const toggle=(open)=>{overlay.classList.toggle('open',open);overlay.setAttribute('aria-hidden',String(!open));main.style.overflowY=open?'hidden':'auto';(open?document.querySelector('.close'):headerMenu)?.focus()};
    headerMenu.addEventListener('click',()=>toggle(true));
    document.querySelector('.close').addEventListener('click',()=>toggle(false));
    document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>toggle(false)));
    document.addEventListener('keydown',event=>{if(event.key==='Escape')toggle(false)});
    if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      const slides=panels.filter(slide=>slide.id!=='home');
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}});
      },{root:main,rootMargin:'0px 0px -8% 0px',threshold:0.01});
      slides.forEach(slide=>{if(slide.getBoundingClientRect().top<innerHeight*.92)slide.classList.add('is-visible');observer.observe(slide)});
      document.documentElement.classList.add('motion-ready');
    }
    const setActive=(panel)=>{
      const dark=panel.dataset.tone==='dark';
      header.classList.toggle('is-dark',dark);
      progress.classList.toggle('is-dark',dark);
      progressLinks.forEach(link=>link.setAttribute('aria-current',String(link.hash==='#'+panel.id)));
      const index=panels.indexOf(panel);
      [panels[index+1],panels[index+2]].filter(Boolean).forEach(next=>{
        const img=next.querySelector('img');
        if(img&&img.loading==='lazy'){const preload=new Image();preload.src=img.currentSrc||img.src}
      });
    };
    const activeObserver=new IntersectionObserver(entries=>{
      entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio).forEach((entry,index)=>{if(index===0)setActive(entry.target)});
    },{root:main,threshold:[.5,.65]});
    panels.forEach(panel=>activeObserver.observe(panel));
  </script>
</body>
</html>
