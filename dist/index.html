<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>cre-ation — We create what people love</title>
  <meta name="description" content="Cre-ation is a creative company improving products, customer experiences and communication.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='11' cy='12' r='6' fill='%23fff'/%3E%3Ccircle cx='21.5' cy='10' r='4.5' fill='%23fff'/%3E%3Ccircle cx='20' cy='22' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:#050505}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}main{width:100%;max-width:960px;margin:0 auto;background:#fff;overflow:hidden}.panel{position:relative;line-height:0}.panel img{display:block;width:100%;height:auto}.menu-hit{position:absolute;z-index:2;right:4%;top:1%;width:28%;height:6%;border:0;background:transparent;cursor:pointer}.work-hit{position:absolute;z-index:2;left:22%;top:78%;width:56%;height:8%;border:0;background:transparent;cursor:pointer}.menu-hit:focus-visible,.work-hit:focus-visible{outline:3px solid #777;outline-offset:-4px}.process-strip{position:absolute;z-index:3;left:0;right:0;top:88.85%;height:5.25%;display:flex;align-items:center;justify-content:space-around;padding:0 4.3%;background:#f8f8f6;border-top:1px solid #111;border-bottom:1px solid #111;color:#111;font-size:clamp(11px,2.15vw,21px);font-weight:400;line-height:1;letter-spacing:-.02em;text-transform:uppercase}.process-stage{animation:stagePulse 6.4s ease-in-out var(--delay) infinite;opacity:.38;transform:translateY(2px)}.process-arrow{font-size:1.45em;font-weight:300;animation:arrowPulse 6.4s ease-in-out var(--delay) infinite;opacity:.28}@keyframes stagePulse{0%,18%,100%{opacity:.38;transform:translateY(2px)}5%,13%{opacity:1;transform:translateY(0)}}@keyframes arrowPulse{0%,18%,100%{opacity:.28;transform:translateX(-2px)}5%,13%{opacity:1;transform:translateX(2px)}}.overlay{position:fixed;z-index:20;inset:0;background:#050505;color:#fff;padding:max(28px,env(safe-area-inset-top)) 6vw max(28px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;opacity:0;pointer-events:none;transition:opacity .22s ease}.overlay.open{opacity:1;pointer-events:auto}.overlay-top{display:flex;justify-content:space-between;align-items:center;font-size:clamp(20px,5vw,38px);font-weight:700}.close{font:400 clamp(16px,4vw,26px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;background:transparent;border:0;padding:12px;cursor:pointer}.nav{display:flex;flex-direction:column;justify-content:center;gap:1.2vh}.nav a{color:#fff;text-decoration:none;text-transform:uppercase;font-weight:900;font-stretch:condensed;font-size:clamp(38px,11vw,94px);line-height:.84;letter-spacing:-.045em}.nav a:hover,.nav a:focus-visible{color:#aaa;outline:none}@media(min-width:961px){body{padding:24px 0}.panel{box-shadow:0 0 0 1px rgba(255,255,255,.08)}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.overlay{transition:none}.process-stage,.process-arrow{animation:none;opacity:1;transform:none}}
    .theme-invert img{filter:invert(1)}
    #what-we-do{height:0;padding-bottom:154.1%;overflow:hidden}
    #what-we-do>img{position:absolute;inset:0;width:100%;height:auto}
    .slide-footer{position:absolute;right:5.4%;bottom:3%;color:#111;font:400 clamp(10px,1.7vw,16px)/1.22 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;letter-spacing:.01em}
    .philosophy-line{position:absolute;left:0;right:0;top:85.8%;height:6.9%;display:flex;align-items:center;padding:0 5.4%;background:#000;color:#fff;font:900 clamp(26px,8.6vw,80px)/1 Impact,'Arial Narrow',Arial,sans-serif;letter-spacing:-.06em;white-space:nowrap}
    #conclusion{height:0;padding-bottom:127%;overflow:hidden}
    #conclusion>img{position:absolute;inset:0;width:100%;height:auto}
    .contact-band{background:#050505;color:#fff;padding:clamp(32px,8vw,75px) 5.4%;font-family:Arial,sans-serif;line-height:1}
    .contact-band a{display:flex;justify-content:space-between;align-items:end;gap:16px;color:inherit;text-decoration:none;border-top:1px solid #fff;padding-top:clamp(20px,5vw,48px);font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(40px,10vw,96px);font-weight:900;letter-spacing:-.035em}
    .contact-band small{font:400 clamp(13px,2.2vw,21px)/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;white-space:nowrap}
    .contact-band a:hover small,.contact-band a:focus-visible small{text-decoration:underline}
    /* Motion preserves the artwork and the height of every slide. */
    #system,#what-we-do,#model,#fans,#metrics,#conclusion{background:#fff}
    #not-marketing,#focus,#inevitability,#philosophy,#curiosity{background:#050505}
    .motion-ready .panel:not(#home)>img{transition:opacity .75s ease,transform .85s cubic-bezier(.2,.7,.2,1);opacity:1;transform:translateY(0) scale(1)}
    .motion-ready .panel:not(#home):not(.is-visible)>img{opacity:0;transform:translateY(18px) scale(1.015)}
    .motion-ready .slide-footer,.motion-ready .philosophy-line{transition:opacity .6s ease .3s,transform .6s ease .3s;opacity:1;transform:translateY(0)}
    .motion-ready .panel:not(.is-visible)>.slide-footer,.motion-ready .panel:not(.is-visible)>.philosophy-line{opacity:0;transform:translateY(10px)}
    #home .process-strip{animation:stripEnter .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes stripEnter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .overlay .nav a{opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .4s cubic-bezier(.2,.7,.2,1),color .2s ease}
    .overlay.open .nav a{opacity:1;transform:translateY(0);transition-delay:calc(var(--item) * 45ms)}
    .overlay.open .nav a:hover,.overlay.open .nav a:focus-visible{transform:translateX(8px)}
    .contact-band a span,.contact-band a small{transition:transform .3s ease}
    .contact-band a:hover span,.contact-band a:focus-visible span{transform:translateX(5px)}
    .contact-band a:hover small,.contact-band a:focus-visible small{transform:translateX(-5px)}
    @media(prefers-reduced-motion:reduce){.motion-ready .panel:not(#home)>img,.motion-ready .slide-footer,.motion-ready .philosophy-line{opacity:1!important;transform:none!important;transition:none!important}#home .process-strip{animation:none}.overlay .nav a{opacity:1;transform:none;transition:none}.contact-band a span,.contact-band a small{transition:none}}
    .art-motion{position:absolute;inset:0;z-index:1;pointer-events:none;--dx:0px;--dy:0px}
    .art-motion::before,.art-motion::after{content:"";position:absolute;inset:0;-webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--cx) var(--cy),#000 80%,transparent 100%);mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--cx) var(--cy),#000 80%,transparent 100%)}
    .art-motion::before{background:var(--paper)}
    .art-motion::after{background:var(--art-image) center top/100% auto no-repeat;animation:artFloat 5.4s ease-in-out infinite alternate;animation-play-state:paused;transform-origin:var(--cx) var(--cy)}
    .theme-invert .art-motion::after{filter:invert(1)}
    .panel.in-view .art-motion::after{animation-play-state:running}
    .art-motion.is-interacting::after{animation:none;transform:translate3d(var(--dx),var(--dy),0) scale(1.012);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
    .art-motion.is-tapped::after{animation:artTap .65s cubic-bezier(.2,.7,.2,1) both}
    @keyframes artFloat{from{transform:translate3d(-2px,2px,0)}to{transform:translate3d(3px,-3px,0)}}
    @keyframes artTap{0%,100%{transform:translate3d(0,0,0) scale(1)}45%{transform:translate3d(0,-6px,0) scale(1.025)}}
    .slide-footer,.philosophy-line{z-index:2}
    .process-stage{appearance:none;border:0;background:none;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;padding:9px 0;cursor:pointer;position:relative}
    .process-stage:focus-visible{outline:2px solid currentColor;outline-offset:2px}
    .process-strip.has-selection .process-stage,.process-strip.has-selection .process-arrow{animation:none;opacity:.35;transform:none}
    .process-strip.has-selection .process-stage.selected{opacity:1}
    .process-strip.has-selection .process-stage.selected::after{content:"";position:absolute;left:0;right:0;bottom:5px;border-bottom:1px solid currentColor}
    @media(prefers-reduced-motion:reduce){.art-motion{display:none}.process-strip.has-selection .process-stage.selected{opacity:1}}
  </style>
</head>
<body>
  <main id="top">
    <section class="panel" id="home"><img src="assets/01-hero.png" alt="Cre-ation. We create what people love." width="942" height="1672" fetchpriority="high"><button class="menu-hit" aria-label="Open menu"></button><a class="work-hit" href="#what-we-do" aria-label="Discover our work"></a><div class="process-strip" aria-label="Creativity leads to action, measurement and iteration"><button class="process-stage" type="button" aria-pressed="false" style="--delay:0s">Creativity</button><span class="process-arrow" style="--delay:.8s" aria-hidden="true">→</span><button class="process-stage" type="button" aria-pressed="false" style="--delay:1.6s">Action</button><span class="process-arrow" style="--delay:2.4s" aria-hidden="true">→</span><button class="process-stage" type="button" aria-pressed="false" style="--delay:3.2s">Measurement</button><span class="process-arrow" style="--delay:4s" aria-hidden="true">→</span><button class="process-stage" type="button" aria-pressed="false" style="--delay:4.8s">Iteration</button></div></section>
    <section class="panel" id="system"><img src="assets/02-system.jpeg" alt="We turn imagination into reality, reality into data, and data into better ideas." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="not-marketing"><img src="assets/03-not-marketing.jpeg" alt="We are not a marketing agency. We create businesses, products and experiences people genuinely love." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="what-we-do"><img src="assets/06-what-we-do-clean.png" alt="A creative agency that makes businesses better through product, customer experience and communication." width="941" height="1672" loading="lazy"><button class="menu-hit" aria-label="Open menu"></button><div class="slide-footer" aria-label="Ideas people love. Businesses grow.">IDEAS<br>PEOPLE LOVE<br>BUSINESSES GROW<br>—</div></section>
    <section class="panel theme-invert" id="focus"><img src="assets/08-focus.jpeg" alt="We focus on improving product, experience and communication." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="model"><img src="assets/04-model.jpeg" alt="No retainer. Our incentives are aligned with yours." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="inevitability"><img src="assets/05-inevitability.png" alt="We design for inevitability and better outcomes." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel theme-invert" id="fans"><img src="assets/07-fans.png" alt="Our goal is to turn customers into fans." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="philosophy"><img src="assets/09-philosophy.jpeg" alt="Our philosophy: action, reality, simplicity and clarity." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button><div class="philosophy-line">CLARITY &gt; COMPLEXITY</div></section>
    <section class="panel" id="metrics"><img src="assets/10-metrics.jpeg" alt="Three metrics, one goal: acquisition, retention and referral." loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="curiosity"><img src="assets/11-curiosity.png" alt="Curiosity is our competitive advantage. We observe, question assumptions, test and measure what matters." width="941" height="1672" loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <section class="panel" id="conclusion"><img src="assets/12-conclusion-clean.png" alt="The beautiful underlying system: creativity, action, measurement and iteration." width="1024" height="1536" loading="lazy"><button class="menu-hit" aria-label="Open menu"></button></section>
    <footer class="contact-band"><a href="/contact/"><span>LET'S TALK.</span><small>CONTACT</small></a></footer>
  </main>
  <aside class="overlay" aria-hidden="true" aria-label="Site menu">
    <div class="overlay-top"><span>cre-ation</span><button class="close" aria-label="Close menu">[ CLOSE ]</button></div>
    <nav class="nav"><a style="--item:0" href="#home">Home</a><a style="--item:1" href="#what-we-do">What we do</a><a style="--item:2" href="#philosophy">Philosophy</a><a style="--item:3" href="#metrics">Metrics</a><a style="--item:4" href="#conclusion">Conclusion</a><a style="--item:5" href="/contact/">Contact</a></nav>
  </aside>
  <script>
    const overlay=document.querySelector('.overlay');
    const toggle=(open)=>{overlay.classList.toggle('open',open);overlay.setAttribute('aria-hidden',String(!open));document.body.style.overflow=open?'hidden':'';(open?document.querySelector('.close'):document.querySelector('.menu-hit'))?.focus()};
    document.querySelectorAll('.menu-hit').forEach(button=>button.addEventListener('click',()=>toggle(true)));
    document.querySelector('.close').addEventListener('click',()=>toggle(false));
    document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>toggle(false)));
    document.addEventListener('keydown',event=>{if(event.key==='Escape')toggle(false)});
    const process=document.querySelector('.process-strip');
    process.querySelectorAll('.process-stage').forEach(stage=>stage.addEventListener('click',()=>{
      const wasSelected=stage.classList.contains('selected');
      process.classList.toggle('has-selection',!wasSelected);
      process.querySelectorAll('.process-stage').forEach(item=>{
        const selected=!wasSelected&&item===stage;
        item.classList.toggle('selected',selected);
        item.setAttribute('aria-pressed',String(selected));
      });
    }));
    // Each artwork uses a masked copy of its existing image; the original typography stays still.
    const artwork={
      home:[72,63,23,14],system:[68,82,32,18],'not-marketing':[83,72,19,27],
      'what-we-do':[77,58,23,22],focus:[50,86,46,15],model:[52,47,47,16],
      inevitability:[59,65,40,14],fans:[51,54,44,14],philosophy:[47,83,43,8],
      metrics:[52,79,43,14],curiosity:[52,76,47,14],conclusion:[51,43,47,13]
    };
    if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      const activeArt=new IntersectionObserver(entries=>entries.forEach(entry=>{
        entry.target.classList.toggle('in-view',entry.isIntersecting);
      }),{rootMargin:'30% 0px 30% 0px'});
      Object.entries(artwork).forEach(([id,[cx,cy,rx,ry]])=>{
        const panel=document.getElementById(id),layer=document.createElement('div');
        layer.className='art-motion';layer.setAttribute('aria-hidden','true');
        layer.style.setProperty('--art-image',`url("${panel.querySelector('img').getAttribute('src')}")`);
        layer.style.setProperty('--paper',id==='home'||['system','what-we-do','model','fans','metrics','conclusion'].includes(id)?'#fff':'#050505');
        for(const [name,value] of Object.entries({cx,cy,rx,ry}))layer.style.setProperty(`--${name}`,`${value}%`);
        panel.append(layer);activeArt.observe(panel);
        const move=event=>{
          const bounds=panel.getBoundingClientRect();
          layer.style.setProperty('--dx',`${Math.round(((event.clientX-bounds.left)/bounds.width-.5)*13)}px`);
          layer.style.setProperty('--dy',`${Math.round(((event.clientY-bounds.top)/bounds.height-.5)*13)}px`);
          layer.classList.add('is-interacting');
        };
        panel.addEventListener('pointermove',move,{passive:true});
        let tapTimeout;
        panel.addEventListener('pointerdown',event=>{
          move(event);clearTimeout(tapTimeout);layer.classList.remove('is-tapped');
          void layer.offsetWidth;layer.classList.add('is-tapped');
          tapTimeout=setTimeout(()=>layer.classList.remove('is-tapped'),650);
        },{passive:true});
        const release=()=>layer.classList.remove('is-interacting');
        panel.addEventListener('pointerleave',release);panel.addEventListener('pointerup',release);panel.addEventListener('pointercancel',release);
      });
    }
    if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
      const slides=[...document.querySelectorAll('.panel:not(#home)')];
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}});
      },{rootMargin:'0px 0px -8% 0px',threshold:0.01});
      slides.forEach(slide=>{if(slide.getBoundingClientRect().top<innerHeight*.92)slide.classList.add('is-visible');observer.observe(slide)});
      document.documentElement.classList.add('motion-ready');
    }
  </script>
</body>
</html>
